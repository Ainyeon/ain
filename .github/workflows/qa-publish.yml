# ═══════════════════════════════════════════════════════════════
# qa-publish — /qa 정적 아카이브 발행 (수동 트리거 전용)
#
# Supabase v_qa_published(definer 뷰, published=true만)를 anon 키로 읽어
# /qa 전 페이지 + sitemap.xml을 생성하고 커밋한다. GitHub Pages가
# 이 레포 main 브랜치를 그대로 서빙하므로 커밋 = 배포.
#
# · 트리거: workflow_dispatch만 — 발행은 검수(published=true 세팅) 후
#   박민혁이 수동으로 돌린다. 크론 없음.
# · 기존 크론 파이프라인(calendar/news/government/briefing/kepco — 상위
#   레포 소속)과 무관·무접촉.
# · service_role 금지 — anon(publishable) 키만 사용. 이 키는 auth.js에
#   이미 공개된 값이라 시크릿이 아니다.
# ═══════════════════════════════════════════════════════════════
name: qa-publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-publish
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build /qa (Supabase anon read)
        run: node tools/qa-build/build.mjs
        env:
          SUPABASE_URL: https://oqgoibbhnidsveueifet.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_SpAwevRkW29BHRuJeFdfSA_Ube6Z4Vo

      - name: Sanity check
        run: |
          test -f qa/index.html
          test -f sitemap.xml
          # JS 없이 소스에 본문 존재 — h1 텍스트가 HTML에 직접 있어야 한다
          grep -q "<h1>" qa/index.html

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa sitemap.xml
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(qa): /qa 정적 발행 — v_qa_published 기준 재생성"
          git push
