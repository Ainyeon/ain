# GitHub Pages(Jekyll) 빌드 설정 — 사이트(ainyeon.com)로 내보내지 않을 것만 적는다.
# 내부 문서·SQL·검사 도구는 저장소에는 있지만 사이트 주소·검색 결과에는 싣지 않는다(2026-09-26).
# exclude 를 적으면 Jekyll 기본 제외 목록을 덮어쓰므로 기본값(Gemfile·node_modules·vendor)도 함께 적는다.
# legacy/(옛 홈 백업)·maker/moodboard.html(승인용 시안)은 기록용이라 저장소에만 두고 사이트 주소로는 내보내지 않는다.
# 목록 항목 사이에는 주석을 넣지 않는다 — tools/test-asset-versions.js 가 이 목록을 줄 단위로 읽는다.
exclude:
  - docs
  - supabase
  - sql
  - tools
  - legacy
  - maker/moodboard.html
  - CLAUDE.md
  - AGENTS.md
  - HANDOFF.md
  - HANDOFF-v2.md
  - HANDOFF-maker.md
  - HANDOFF-maker-v2.md
  - HANDOFF-maker-v3.md
  - HANDOFF-community.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
