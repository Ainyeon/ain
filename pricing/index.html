<body class="has-tabbar">
  <nav class="tnav">
    <div class="tnav-in">
      <a class="brand" href="/"><svg class="brand-word" viewBox="0 0 929 307" role="img" aria-label="A.IN"><defs><linearGradient id="bgw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2D4A9E"/><stop offset="1" stop-color="#9E2D3D"/></linearGradient></defs><g fill="url(#bgw)"><path d="M149 0L0 303L202 302L178 250L85 249L179 61L298 303L358 303L211 1Z"/><circle cx="427" cy="268" r="40"/><path d="M510 0L509 302L565 303L565 0Z"/><path d="M633 0L632 302L688 302L689 88L862 303L927 303L928 1L872 1L871 224L693 0Z"/></g></svg><span class="brand-name">에어컨 인테리어 연구소</span></a>

        <a href="/">홈</a>

  <main class="shell" id="draft">
    <div class="empty" role="status">확인 중…</div>
  </main>

  <script>
  addEventListener("DOMContentLoaded", () => {
    if (window.ainAuth) ainAuth.init("authSlot");
    const box = document.getElementById("draft");
    const nothing = () => {
      const p = document.createElement("div");
      p.className = "empty"; p.textContent = "없는 페이지입니다.";
      box.replaceChildren(p);
    };
    // 운영자만 행이 온다(RLS). 비로그인은 조회하지 않는다 — anon 은 권한이 없어 콘솔에 401이 남는다.
    async function show() {
      const session = window.ainAuth && await ainAuth.getSession();
      if (!session) return nothing();
      const { data, error } = await ainAuth.getClient().from("admin_drafts")
        .select("html").eq("slug", "pricing").maybeSingle();
      if (error || !data) return nothing();
      const frame = document.createElement("iframe");
      frame.title = "요금제 초안";
      // 초안 안의 스크립트는 돌리지 않는다. 같은 출처라 높이만 읽고, 링크는 누를 때만 바깥 창으로 연다.
      frame.setAttribute("sandbox", "allow-same-origin allow-top-navigation-by-user-activation");
      frame.style.cssText = "display:block;width:100%;border:0;min-height:60vh";
      const fit = () => { try { frame.style.height = frame.contentDocument.documentElement.scrollHeight + "px"; } catch (e) {} };
      frame.addEventListener("load", fit);
      addEventListener("resize", fit);
      frame.srcdoc = data.html;
      box.replaceChildren(frame);
    }
    show();
    addEventListener("ain:auth", show);
  });
  </script>
</body>
</html>
