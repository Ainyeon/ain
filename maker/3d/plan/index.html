<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>도면 그리기 | 3D 스튜디오</title>
  <meta name="description" content="벽·방·기둥·개구부를 그려 도면을 만들고 에어컨을 놓아 물량표까지 뽑습니다.">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="theme-color" content="#F3F2EF">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="preload" href="/assets/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/maker/3d/partner-boot.js?v=2"></script>
  <link rel="stylesheet" href="/assets/css/design-tokens.css?v=12">
  <link rel="stylesheet" href="/maker/3d/plan/plan.css?v=2">
  <script type="module" src="/maker/3d/plan/app.js?v=1"></script>
</head>
<body class="pl">
  <a class="ed-skip" href="#plCanvas">도면 캔버스로 건너뛰기</a>
  <div class="ed-app" id="plApp">
    <header class="ed-top" id="plTop">
      <h1 class="ed-vh">도면 그리기</h1>
      <a class="ed-logo" id="plLogo" href="/maker/3d/projects/" aria-label="에인연 스튜디오 · 내 프로젝트로 나가기"><img src="/assets/ain-wordmark-v4.svg" alt="" height="20"></a>
      <div class="ed-hist" role="group" aria-label="실행 취소">
        <button type="button" class="ed-b ghost" id="plUndo" title="실행 취소 (Ctrl+Z)" disabled>실행 취소</button>
        <button type="button" class="ed-b ghost" id="plRedo" title="다시 실행 (Shift+Ctrl+Z)" disabled>다시 실행</button>
      </div>
      <input class="ed-title" id="plTitle" type="text" maxlength="60" autocomplete="off" aria-label="도면 제목">
      <button type="button" class="ed-b ghost ed-more" id="plMore" aria-expanded="false" aria-controls="plMenu">메뉴</button>
      <div class="ed-menu" id="plMenu" role="group" aria-label="도면 메뉴">
        <button type="button" class="ed-b ghost ed-small-only" id="plRename">이름 바꾸기</button>
        <button type="button" class="ed-b ghost" id="plEstimate">견적 물량표</button>
        <button type="button" class="ed-b ghost" id="plExport">도면 내보내기 (.json)</button>
        <button type="button" class="ed-b ghost" id="plImport">도면 불러오기</button>
        <button type="button" class="ed-b ghost" id="plNew">새로 만들기</button>
        <button type="button" class="ed-b ghost ed-small-only" id="plExitMenu">나가기</button>
      </div>
      <span class="ed-ss" id="plSaveState" role="status">저장 이력 없음</span>
      <button type="button" class="ed-b primary" id="plSave" title="저장 (Ctrl+S)">저장</button>
      <button type="button" class="ed-b ed-big-only" id="plExit">나가기</button>
    </header>

    <nav class="ed-rail" id="plRail" aria-label="작업 구역">
      <button type="button" class="ed-rb" data-panel="templates">템플릿</button>
      <button type="button" class="ed-rb" data-panel="draw">도면 그리기</button>
      <button type="button" class="ed-rb" data-panel="products">제품</button>
      <button type="button" class="ed-rb" data-panel="materials">마감재</button>
      <button type="button" class="ed-rb" data-panel="library">설계형 라이브러리</button>
      <button type="button" class="ed-rb" data-panel="resources">리소스 관리</button>
    </nav>

    <aside class="ed-panel" id="plPanel" aria-labelledby="plPanelTitle">
      <div class="ed-ph"><h2 id="plPanelTitle">도면 그리기</h2><button type="button" class="ed-x ed-small-only" id="plPanelClose" aria-label="패널 닫기">×</button></div>
      <div class="ed-pb" id="plPanelBody"></div>
    </aside>

    <main class="ed-stage" id="plStage">
      <canvas id="plCanvas" tabindex="0" role="application" aria-label="도면 캔버스 · 도구 단축키는 왼쪽 패널에 있습니다"></canvas>
      <div class="ed-3d" id="plView3d" hidden></div>
      <div class="ed-hint" id="plHint"><strong id="plHintName">선택</strong><span id="plHintText"></span></div>
      <button type="button" class="ed-edge l" id="plPanelToggle" aria-label="왼쪽 패널 접기" aria-expanded="true" aria-controls="plPanel">‹</button>
      <button type="button" class="ed-edge r" id="plSideToggle" aria-label="오른쪽 패널 접기" aria-expanded="true" aria-controls="plSide">›</button>

      <div class="ed-ctls">
        <div class="ed-ctl l" role="group" aria-label="보기">
          <div class="ed-seg" role="group" aria-label="2D 3D 전환">
            <button type="button" class="ed-sb" id="plMode2d" aria-pressed="true">2D</button>
            <button type="button" class="ed-sb" id="plMode3d" aria-pressed="false">3D</button>
          </div>
          <div class="ed-seg only2d" role="group" aria-label="표시">
            <button type="button" class="ed-sb" id="plLabels" aria-pressed="true" title="방 이름·면적 라벨">라벨</button>
            <button type="button" class="ed-sb" id="plGrid" aria-pressed="true" title="격자">격자</button>
          </div>
          <div class="ed-views" id="plViews" role="group" aria-label="3D 보기" hidden>
            <button type="button" class="ed-row" data-view="plan" id="plV2"><span>평면 뷰어</span><kbd class="ed-k">2</kbd></button>
            <button type="button" class="ed-row" data-view="iso" id="plV3"><span>ISO 뷰어</span><kbd class="ed-k">3</kbd></button>
            <button type="button" class="ed-row" data-view="free" id="plV4"><span>일반 뷰어</span><kbd class="ed-k">4</kbd></button>
          </div>
        </div>
        <div class="ed-ctl r" role="group" aria-label="화면 조절">
          <button type="button" class="ed-sb" id="plLock" aria-pressed="false" title="잠금 · 그림을 고칠 수 없게 합니다">잠금</button>
          <button type="button" class="ed-sb only2d ed-hide-small" id="plSnap" title="지금 화면을 PNG 로 저장">스냅샷</button>
          <button type="button" class="ed-sb only2d" id="plZoomIn" aria-label="확대 (+)" title="확대 (+)">+</button>
          <button type="button" class="ed-sb only2d" id="plZoomOut" aria-label="축소 (-)" title="축소 (-)">−</button>
          <button type="button" class="ed-sb only2d" id="plFit" title="그림 전체가 보이게 맞춥니다">맞춤</button>
          <div class="ed-seg ed-hide-small" role="group" aria-label="길이 단위">
            <button type="button" class="ed-sb" id="plUnitMm" aria-pressed="true">mm</button>
            <button type="button" class="ed-sb" id="plUnitFt" aria-pressed="false">ft/in</button>
          </div>
        </div>
      </div>
    </main>

    <section class="ed-sec ed-props" id="plProps" aria-labelledby="plPropsH" hidden></section>

    <aside class="ed-side" id="plSide" aria-label="층과 설정">
      <section class="ed-sec" aria-labelledby="plMiniH"><div class="ed-sec-h"><h2 id="plMiniH">미니맵</h2><button type="button" class="ed-x ed-small-only" id="plSideClose" aria-label="오른쪽 패널 닫기">×</button></div><canvas id="plMini" aria-label="미니맵 · 누르거나 끌면 화면이 옮겨 갑니다"></canvas></section>
      <section class="ed-sec" aria-labelledby="plFloorH2">
        <h2 id="plFloorH2">층 관리</h2>
        <label class="ed-f"><span>현재 층</span><select id="plFloorSel"></select></label>
        <button type="button" class="ed-b wide" id="plFloorAdd">층 추가하기</button>
        <label class="ed-f"><span>층 이름</span><span class="in"><input id="plFloorName" type="text" maxlength="30" autocomplete="off"></span></label>
        <label class="ed-f"><span>층 높이</span><span class="in"><input id="plFloorH" type="number" min="100" max="20000" step="10" inputmode="numeric"><em>mm</em></span></label>
      </section>
      <section class="ed-sec" aria-labelledby="plDetH">
        <h2 id="plDetH">상세 설정</h2>
        <div class="ed-f"><span id="plAreaL">실면적</span>
          <div class="ed-seg wide" role="group" aria-labelledby="plAreaL"><button type="button" class="ed-sb" id="plAreaNet" aria-pressed="true">실면적</button><button type="button" class="ed-sb" id="plAreaGross" aria-pressed="false">실면적+내외벽</button></div>
          <output class="ed-out" id="plArea" for="plAreaNet plAreaGross">0.0 m²</output></div>
        <label class="ed-f"><span>슬래브 두께</span><span class="in"><input id="plSlab" type="number" min="0" max="2000" step="10" inputmode="numeric"><em>mm</em></span></label>
        <div class="ed-f"><label for="plWallA">벽 투명도</label><div class="ed-rg"><input id="plWallA" type="range" min="0" max="100" step="5"><span class="in"><input id="plWallAn" type="number" min="0" max="100" step="5" aria-label="벽 투명도 숫자"><em>%</em></span></div></div>
        <div class="ed-f"><label for="plFloorA">바닥 투명도</label><div class="ed-rg"><input id="plFloorA" type="range" min="0" max="100" step="5"><span class="in"><input id="plFloorAn" type="number" min="0" max="100" step="5" aria-label="바닥 투명도 숫자"><em>%</em></span></div></div>
      </section>
      <section class="ed-sec" id="plUnder" aria-labelledby="plUnderH" hidden></section>
    </aside>
  </div>

  <div class="ed-toasts" id="plToast" role="status" aria-live="polite"></div>
  <div class="ed-vh" id="plLive" aria-live="polite"></div>
  <input type="file" id="plFileJson" accept=".json,application/json" hidden>
  <input type="file" id="plFileImg" accept="image/*" hidden>
</body>
</html>
