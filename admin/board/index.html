<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시판 관리 | 에어컨 인테리어 연구소</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://oqgoibbhnidsveueifet.supabase.co">
  <link rel="preload" href="/assets/fonts/PretendardVariable.subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/design-tokens.css?v=11">
  <link rel="stylesheet" href="/assets/css/components.css?v=26">
  <link rel="stylesheet" href="/board/board.css?v=26">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="/auth.js?v=26"></script>
  <script defer src="/assets/js/ain-common.js?v=26"></script>
  <script defer src="/assets/js/ain-community.js?v=26"></script>
</head>
<body>
  <nav class="tnav">
    <div class="tnav-in">
      <a class="brand" href="/"><svg class="brand-word" viewBox="0 0 929 307" role="img" aria-label="A.IN"><defs><linearGradient id="bgw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2D4A9E"/><stop offset="1" stop-color="#9E2D3D"/></linearGradient></defs><g fill="url(#bgw)"><path d="M149 0L0 303L202 302L178 250L85 249L179 61L298 303L358 303L211 1Z"/><circle cx="427" cy="268" r="40"/><path d="M510 0L509 302L565 303L565 0Z"/><path d="M633 0L632 302L688 302L689 88L862 303L927 303L928 1L872 1L871 224L693 0Z"/></g></svg><span class="brand-name">에어컨 인테리어 연구소</span></a>
      <div class="tnav-links">
        <a href="/board/free/">자유게시판</a>
        <a href="/board/proposal/">제안·건의</a>
      </div>
      <div class="tnav-auth" id="authSlot"></div>
    </div>
  </nav>
  <main class="shell">
    <header class="phero">
      <div class="phero-bar">
        <div>
          <div class="crumb">ADMIN · BOARD</div>
          <h1>게시판 관리</h1>
          <p class="sub">신고 처리와 제안 상태 변경. 관리자 전용입니다.</p>
        </div>
      </div>
    </header>
    <section class="board-wrap" id="panel" aria-live="polite">
      <div class="gate-msg">권한 확인 중…</div>
    </section>
  </main>
  <script>
    (function () {
      'use strict';
      const STATUS_LABELS = {
        open: '투표중', adopted: '채택됨', building: '개발중', shipped: '반영완료',
        held: '보류', declined: '안 함'
      };
      const NEEDS_REASON = ['held', 'declined'];   // 보류·안 함은 이유 없이 두지 않는다 (RPC도 강제)
      const THRESHOLD_COUNT = 20, THRESHOLD_RATE = 0.7;
      const panel = document.getElementById('panel');
      const db = () => ainAuth.getClient();
      const gate = (h) => panel.innerHTML = '<div class="gate-msg">' + h + '</div>';
      let filterReached = false;
      let meUserId = null;
      let tab = 'mod'; // 'mod' | 'members'
      let memberQuery = '';

      function tally(votes) {
        const m = {};
        for (const v of votes || []) {
          const t = m[v.post_id] || (m[v.post_id] = { up: 0, down: 0 });
          t[v.vote]++;
        }
        return m;
      }
      const reached = (t) => t && t.up >= THRESHOLD_COUNT && t.up / (t.up + t.down) >= THRESHOLD_RATE;

      function tabsHtml() {
        return '<div class="sort-toggle" role="group" aria-label="관리 탭" style="margin-bottom:4px">'
          + '<button type="button" id="tabMod" class="' + (tab === 'mod' ? 'on' : '') + '">신고·상태</button>'
          + '<button type="button" id="tabMembers" class="' + (tab === 'members' ? 'on' : '') + '">회원 관리</button></div>';
      }
      function bindTabs() {
        document.getElementById('tabMod').addEventListener('click', () => { tab = 'mod'; render(); });
        document.getElementById('tabMembers').addEventListener('click', () => { tab = 'members'; renderMembers(); });
      }

      // 회원 관리: 닉네임 검색 → role 변경 (admin만 이 페이지 진입 가능. manager/member 전환만 — RPC 제약)
      async function renderMembers() {
        let q = db().from('profiles').select('id,nickname,field,role').order('nickname').limit(50);
        if (memberQuery) q = q.ilike('nickname', '%' + memberQuery + '%');
        const { data: members, error } = await q;
        if (error) { gate('회원 목록 로드 실패 (08 SQL 실행 여부 확인): ' + escT(error.message)); return; }

        const rows = (members || []).filter((m) => m.nickname).map((m) => {
          const roleSel = m.role === 'admin'
            ? '<span class="role-badge role-admin">운영자</span>'
            : '<select data-role="' + m.id + '" aria-label="역할 변경">'
              + '<option value="member"' + (m.role !== 'manager' ? ' selected' : '') + '>회원</option>'
              + '<option value="manager"' + (m.role === 'manager' ? ' selected' : '') + '>매니저</option></select>';
          return '<div class="board-card admin-row"><span class="author-line">'
            + ainCommunity.authorBadge(m) + '</span>' + roleSel + '</div>';
        }).join('') || '<p class="empty-note">' + (memberQuery ? '검색 결과 없음' : '닉네임 설정한 회원 없음') + '</p>';

        panel.innerHTML = tabsHtml()
          + '<form id="memSearch" class="cmt-form" style="margin:0 0 6px">'
          + '<input type="search" id="memQ" placeholder="닉네임 검색" value="' + escT(memberQuery) + '" aria-label="닉네임 검색">'
          + '<button type="submit">검색</button></form>'
          + rows;
        bindTabs();
        document.getElementById('memSearch').addEventListener('submit', (e) => {
          e.preventDefault();
          memberQuery = document.getElementById('memQ').value.trim();
          renderMembers();
        });
        panel.querySelectorAll('[data-role]').forEach((sel) =>
          sel.addEventListener('change', async () => {
            const { error: err } = await db().rpc('admin_set_role', {
              p_user_id: sel.dataset.role, p_role: sel.value
            });
            alert(err ? '변경 실패: ' + err.message : '역할 변경 완료: ' + (sel.value === 'manager' ? '매니저' : '회원'));
            renderMembers();
          }));
      }

      async function render() {
        const [{ data: posts, error: pe }, { data: votes }, { data: reports, error: re }, { data: cmts }] = await Promise.all([
          ainCommunity.readPosts((q) => q.order('created_at', { ascending: false }).limit(200), meUserId)
            .then((r) => ({ data: r.rows, error: r.error })),
          db().from('votes').select('post_id,vote'),
          db().from('reports').select('target_type,target_id,reason,created_at'),
          db().from('comments').select('id,post_id,body,author:profiles(nickname)')
        ]);
        if (pe) { gate('데이터 로드 실패: ' + escT(pe.message)); return; }
        if (re) { gate('신고 목록 접근 불가 — 관리자 권한(is_admin)이 필요합니다.'); return; }

        const t = tally(votes);
        // 신고 집계
        const repCount = {}; // 'post-1' → n
        (reports || []).forEach((r) => {
          const k = r.target_type + '-' + r.target_id;
          repCount[k] = (repCount[k] || 0) + 1;
        });
        const cmtById = {};
        (cmts || []).forEach((c) => cmtById[c.id] = c);

        // 동일 계정 단시간 반복 작성 (SPEC §3.7) — 작성자 기준이라 서버에서 센다.
        // RPC는 post_id와 플래그만 돌려주므로 author_id가 화면으로 새지 않는다(익명 보호 유지).
        // 자동 비공개·작성 금지가 아니라 운영자 검토 신호다. RPC가 없으면 조용히 표시하지 않는다.
        const REPEAT_MIN = 10;
        const burst = new Set();
        {
          const { data: flags } = await db().rpc('admin_repeat_flags', { p_window_min: REPEAT_MIN, p_limit: 3 });
          (flags || []).forEach((f) => { if (f.repeat_flag) burst.add(f.post_id); });
        }

        // 신고 많은 순 목록
        const reportedRows = Object.entries(repCount).sort((a, b) => b[1] - a[1]).map(([k, n]) => {
          const [type, idStr] = k.split('-');
          const id = Number(idStr);
          let label = '';
          if (type === 'post') {
            const p = (posts || []).find((x) => x.id === id);
            label = p ? '글: ' + p.title : '글 #' + id + ' (삭제됨?)';
          } else {
            const c = cmtById[id];
            label = c ? '댓글: ' + c.body.slice(0, 40) : '댓글 #' + id + ' (삭제됨?)';
          }
          return '<div class="board-card admin-row"><span>' + escT(label) + '</span>'
            + '<span><span class="report-count">신고 ' + n + '건</span> '
            + '<button type="button" class="tool-link" data-del="' + type + ':' + id + '">삭제</button></span></div>';
        }).join('') || '<p class="empty-note">신고된 게시물이 없습니다.</p>';

        // 제안 상태 관리 (임계 도달 필터)
        const proposals = (posts || []).filter((p) => p.board_type === 'proposal')
          .filter((p) => !filterReached || reached(t[p.id]));
        const stateRows = proposals.map((p) => {
          const tv = t[p.id] || { up: 0, down: 0 };
          const opts = Object.entries(STATUS_LABELS).map(([v, l]) =>
            '<option value="' + v + '"' + (p.status === v ? ' selected' : '') + '>' + l + '</option>').join('');
          return '<div class="board-card' + (reached(tv) && p.status === 'open' ? ' reach-highlight' : '') + '">'
            + '<div class="admin-row">'
            + '<span><a href="/board/proposal/?id=' + p.id + '"><b>' + escT(p.title) + '</b></a>'
            + (p.is_anonymous ? ' <span class="field-badge">익명</span>' : '')
            + (burst.has(p.id) ? ' <span class="report-count">단시간 반복 작성</span>' : '') + '<br>'
            + '<span style="font-size:12px;color:var(--c-ink-faint)">찬 ' + tv.up + ' · 반 ' + tv.down
            + (reached(tv) ? ' · <span class="reach-note">채택 기준 도달</span>' : '') + '</span></span>'
            + '<select data-status="' + p.id + '" aria-label="상태 변경">' + opts + '</select></div>'
            + '<form class="write-form" data-state-form="' + p.id + '" style="margin-top:8px">'
            + '<label class="write-hint" for="sr' + p.id + '">상태 이유 (보류·안 함은 필수)</label>'
            + '<input type="text" id="sr' + p.id + '" data-reason="' + p.id + '" maxlength="500" value="' + escT(p.status_reason || '') + '">'
            + '<label class="write-hint" for="sa' + p.id + '">운영자 답변 — 제안자의 내 활동에 그대로 보입니다</label>'
            + '<textarea id="sa' + p.id + '" data-answer="' + p.id + '" maxlength="2000">' + escT(p.admin_answer || '') + '</textarea>'
            + '<div class="form-actions"><button type="button" class="btn-ghost" data-who="' + p.id + '">작성자 확인</button>'
            + '<button type="submit" class="btn-primary">상태·답변 저장</button></div></form>'
            + '</div>';
        }).join('') || '<p class="empty-note">' + (filterReached ? '임계 도달 제안 없음' : '제안 없음') + '</p>';

        const burstNote = burst.size
          ? '<div class="rules-banner">같은 계정이 ' + REPEAT_MIN + '분 안에 3건 이상 올린 글 '
            + burst.size + '건이 있습니다. 검토 신호일 뿐 자동으로 가려지거나 막히지 않습니다.</div>'
          : '';

        panel.innerHTML = tabsHtml() + burstNote
          + '<h2 style="font-size:15px;font-weight:800">신고 많은 순</h2>' + reportedRows
          + '<h2 style="font-size:15px;font-weight:800;margin-top:14px">제안 상태 관리 '
          + '<button type="button" class="tool-link" id="fltReached" style="font-size:12px">'
          + (filterReached ? '[전체 보기]' : '[임계 도달만]') + '</button></h2>'
          + stateRows;

        bindTabs();
        document.getElementById('fltReached').addEventListener('click', () => { filterReached = !filterReached; render(); });
        panel.querySelectorAll('[data-state-form]').forEach((form) => {
          const id = Number(form.dataset.stateForm);
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = panel.querySelector('[data-status="' + id + '"]').value;
            const reason = panel.querySelector('[data-reason="' + id + '"]').value.trim();
            const answer = panel.querySelector('[data-answer="' + id + '"]').value.trim();
            if (NEEDS_REASON.includes(status) && !reason) {
              alert('보류·안 함은 이유를 함께 적어야 합니다.'); return;
            }
            const { error } = await db().rpc('admin_set_post_state', {
              p_post_id: id, p_status: status, p_reason: reason || null, p_answer: answer || null
            });
            if (error) { alert('저장하지 못했습니다.'); console.error(error); return; }
            render();
          });
        });
        // 작성자 확인 — 익명 글도 운영자만, 목적을 정해서, 열람 기록을 남기며 조회한다
        panel.querySelectorAll('[data-who]').forEach((b) =>
          b.addEventListener('click', async () => {
            const purpose = prompt('작성자 확인 목적을 고르세요:\n1. 중복 확인\n2. 악용 확인', '1');
            if (purpose == null) return;
            const p_purpose = purpose.trim() === '2' ? 'abuse' : 'duplicate';
            const { data, error } = await db().rpc('admin_post_author', {
              p_post_id: Number(b.dataset.who), p_purpose
            });
            if (error) { alert('작성자를 확인하지 못했습니다.'); console.error(error); return; }
            const row = (data || [])[0];
            alert(row ? row.nickname + ' (' + row.role + ') · 총 작성 ' + row.post_count + '건\n이 조회는 기록에 남습니다.'
                      : '작성자 정보를 찾을 수 없습니다.');
          }));
        panel.querySelectorAll('[data-del]').forEach((b) =>
          b.addEventListener('click', async () => {
            const [type, id] = b.dataset.del.split(':');
            if (!confirm('신고된 ' + (type === 'post' ? '글' : '댓글') + '을 삭제할까요?')) return;
            const { error } = await db().from(type === 'post' ? 'posts' : 'comments').delete().eq('id', Number(id));
            if (error) alert('삭제 실패: ' + error.message); else render();
          }));
      }

      addEventListener('DOMContentLoaded', async () => {
        const me = await ainCommunity.getMyProfile();
        if (me.infraError) { gate('게시판을 준비하는 중입니다.'); return; }
        if (!me.user) { gate('로그인이 필요합니다.'); return; }
        if (!me.profile || !(me.profile.role === 'admin' || me.profile.is_admin)) {
          gate('관리자 전용 페이지입니다.'); return;
        }
        meUserId = me.user.id;
        render();
      });
    })();
  </script>
</body>
</html>
