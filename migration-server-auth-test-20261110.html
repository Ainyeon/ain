<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>인증 연결 확인</title><body><p id="status" role="status">인증을 기다리고 있습니다.</p><div id="container"></div><script>
/* Local proof of concept only: cross-origin Turnstile frame transport. */
(function (root) {
  'use strict';
  const idPattern = /^[a-f0-9]{8}-[a-f0-9]{4}-4[a-f0-9]{3}-[89ab][a-f0-9]{3}-[a-f0-9]{12}$/i;
  function makeParent({frame, frameOrigin, submissionId, onToken, onError}) {
    if (!frame || !frame.contentWindow || new URL(frameOrigin).origin !== frameOrigin || !idPattern.test(submissionId)) throw new Error('invalid-config');
    let state = 'waiting';
    return {
      receive(event) {
        if (event.source !== frame.contentWindow || event.origin !== frameOrigin || !event.data || event.data.submissionId !== submissionId) return;
        if (event.data.type === 'challenge-ready' && state === 'waiting') {
          state = 'started';
          frame.contentWindow.postMessage({type:'challenge-start', submissionId}, frameOrigin);
        } else if (event.data.type === 'challenge-token' && state === 'started' && typeof event.data.token === 'string' && event.data.token.length > 0 && event.data.token.length <= 2048) {
          state = 'done'; onToken(event.data.token);
        } else if (event.data.type === 'challenge-error' && state === 'started') {
          state = 'done'; onError();
        }
      },
      close() { state = 'done'; }
    };
  }
  function makeChild({parent, parentOrigin, submissionId, start}) {
    if (!parent || new URL(parentOrigin).origin !== parentOrigin || !idPattern.test(submissionId)) throw new Error('invalid-config');
    let state = 'waiting';
    return {
      ready() { if (state === 'waiting') parent.postMessage({type:'challenge-ready', submissionId}, parentOrigin); },
      receive(event) {
        if (state !== 'waiting' || event.source !== parent || event.origin !== parentOrigin || !event.data || event.data.type !== 'challenge-start' || event.data.submissionId !== submissionId) return;
        state = 'started';
        start({submissionId, token(value) {
          if (state !== 'started' || typeof value !== 'string' || !value || value.length > 2048) return;
          state = 'done'; parent.postMessage({type:'challenge-token', submissionId, token:value}, parentOrigin);
        }, error() { if (state === 'started') { state = 'done'; parent.postMessage({type:'challenge-error', submissionId}, parentOrigin); } }});
      }
    };
  }
  root.isolatedChallengeBridge = {makeParent, makeChild};
})(globalThis);

</script><script>
(() => {
 const id=crypto.randomUUID(), origin='https://challenge.ainyeon.com';
 const frame=document.createElement('iframe'); frame.title='댓글 인증 연결 확인'; document.getElementById('container').append(frame);
 const bridge=isolatedChallengeBridge.makeParent({frame,frameOrigin:origin,submissionId:id,onToken:async token=>{
   const status=document.getElementById('status'); status.textContent='서버 인증과 시험 댓글을 확인하고 있습니다.';
   try {
     const r=await fetch('https://alpha-verification-probe.alpha-internet-research.pages.dev/api/temporary-comment-test',{
       method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',cache:'no-store',
       body:JSON.stringify({submission_id:id,challenge:token})});
     const result=await r.json();
     status.textContent=r.status===201 && result.result==='created'?'서버 인증 및 시험 댓글 등록 성공':'서버 인증 또는 시험 댓글 등록 실패';
   } catch (_) {status.textContent='시험 서버에 연결하지 못했습니다.';}
 },onError:()=>{document.getElementById('status').textContent='인증 실패';}});
 window.addEventListener('message',event=>bridge.receive(event));
 const url=new URL('/challenge/',origin);url.searchParams.set('submission',id);frame.src=url.href;
})();
</script></body></html>
