  <link rel="stylesheet" href="/assets/css/components.css?v=30">
  <link rel="stylesheet" href="/work/work.css?v=30">
  <style>
    /* 고객(소비자)이 보는 공개 페이지: 기술자용 탭바·설치 배너·서비스워커 없이 토큰만 */
    .card-wrap{max-width:560px;margin:0 auto;padding:var(--sp-5) var(--sp-4) var(--sp-9);display:grid;gap:var(--sp-4)}
    .card-biz{display:grid;gap:var(--sp-2);padding:var(--sp-5) var(--sp-4)}
    .card-biz img{max-height:56px;max-width:180px;object-fit:contain}
    .card-biz h1{font-size:var(--fs-1);font-weight:var(--fw-bold);letter-spacing:-0.02em}
    .card-biz p{color:var(--c-ink-sub);font-size:var(--fs-3)}
    .card-call{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);padding:0 var(--sp-4) var(--sp-4)}
    .card-call .w-btn{min-height:52px;font-size:var(--fs-2)}
    .card-warranty{margin:0 var(--sp-4) var(--sp-4);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-2);
      background:var(--c-accent-bg);border:1px solid var(--c-accent-line);color:var(--c-accent);font-weight:var(--fw-bold)}
    .card-warranty.over{background:var(--c-surface-sub);border-color:var(--c-line);color:var(--c-ink-sub)}
    .card-job{padding:var(--sp-4);border-top:1px solid var(--c-line);display:grid;gap:var(--sp-2)}
    .card-job:first-child{border-top:0}
    .card-job h3{font-size:var(--fs-2);font-weight:var(--fw-bold)}
    .card-job ul{list-style:none;display:grid;gap:2px;font-size:var(--fs-3);color:var(--c-ink-sub)}
    .card-kinds{display:flex;gap:var(--sp-2);flex-wrap:wrap}
    .card-kinds label{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:44px;padding:0 var(--sp-3);
      border:1px solid var(--c-line-strong);border-radius:var(--r-1);font-size:var(--fs-3);background:var(--c-surface)}
    .card-kinds input{width:18px;height:18px}
    .card-foot{text-align:center;font-size:var(--fs-4);color:var(--c-ink-faint);line-height:1.7}
    .card-foot a{color:var(--c-accent);font-weight:var(--fw-semi)}
  </style>
  <!-- 고객 개인정보를 다루는 화면이라 버전 고정 + 무결성(SRI). 올릴 때는 해시도 함께 -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
  <script defer src="/auth.js?v=30"></script>
  <script defer src="/assets/js/ain-community.js?v=30"></script>
  <script defer src="/work/work-logic.js?v=30"></script>
  <script defer src="/c/card.js?v=30"></script>
</head>
<body>
  <main class="card-wrap" id="card"><div class="empty">시공 카드를 여는 중</div></main>
</body>
</html>
